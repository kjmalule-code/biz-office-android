
name: Build Biz Office APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Diagnose APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "=== APK PACKAGE DETAILS ==="
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -n 5
          echo "=== APK SIGNATURE VERIFICATION ==="
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "=== NATIVE LIBRARIES ==="
          unzip -l "$APK" | grep -E 'lib/[^/]+/[^/]+\.so' || echo "No native libraries included"
          echo "=== APK FILE SIZE ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biz-Office-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
